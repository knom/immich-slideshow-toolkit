name: Publish Container Release

on:
  push:
    tags:
      - 'v*.*'

jobs:
  release-container:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate version tag format
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match vX.Y format (e.g., v1.2)"
            exit 1
          fi

      - name: Build image
        run: |
          IMAGE_NAME=${{ github.repository }}
          docker build . --file Dockerfile --tag $IMAGE_NAME --label "runnumber=${GITHUB_RUN_ID}"

      - name: Log in to registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image
        run: |
          IMAGE_NAME=${{ github.repository }}
          IMAGE_ID=ghcr.io/$IMAGE_NAME
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
          REF=${{ github.ref }}
          VERSION=$(echo "$REF" | sed -e 's,.*/,,') # extract last part

          VERSION=$(echo $VERSION | sed -e 's/^v//')  # strip 'v' prefix

          echo "IMAGE_ID=$IMAGE_ID"
          echo "VERSION=$VERSION"

          # Publish both the extracted X.Y version and latest for default pulls.
          TAGS=("$VERSION" "latest")

          for TAG in "${TAGS[@]}"; do
            echo "Tagging $IMAGE_ID:$TAG"
            docker tag $IMAGE_NAME $IMAGE_ID:$TAG
            docker push $IMAGE_ID:$TAG
          done